[package]
name = "caffeine-applet"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "A simple COSMIC applet that prevents your system from going idle by creating a systemd-inhibit lock session."
repository = "https://github.com/codevardhan/caffeine-applet"

[dependencies]
dirs = "6"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
i18n-embed-fl = "0.9.2"
rust-embed = "8.5.0"

[dependencies.i18n-embed]
version = "0.15"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
# Deliberately unpinned. `cosmic-panel` depends on libcosmic without a rev, so a
# `rev =` here splits the graph into two libcosmic sources, which the Flatpak
# cargo vendoring cannot express. Cargo.lock still pins the exact commit.
default-features = false
features = ["applet", "tokio", "wayland"]

[dependencies.zbus]
version = "5"
default-features = false
features = ["blocking"]