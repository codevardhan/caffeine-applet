<svg width="16" height="16" viewBox="0 0 16 16" fill="none"
    xmlns="http://www.w3.org/2000/svg">
    <g id="applet-coffee-inactive" stroke="#232323" stroke-width="1.5" fill="none"
        stroke-linejoin="round">
        <!-- Cup body, hollow. The path is the stroke centerline, inset 0.75 (half
             the stroke width) from the outer edge so the painted boundary lands on
             x 2..11, y 6..14 - identical to the solid "on" cup. -->
        <path d="M 2.75 6.75 L 10.25 6.75 L 10.25 12
                 A 1.25 1.25 0 0 1 9 13.25
                 L 4 13.25
                 A 1.25 1.25 0 0 1 2.75 12 Z" />

        <!-- Handle. Geometry is shared verbatim with the "on" icon so the icon does
             not appear to shift when a session is toggled. -->
        <path d="M 10.25 8 A 2 2 0 1 1 10.25 11.5" />

        <!-- No steam: an idle cup. -->
    </g>
</svg>
