<svg width="128" height="128" viewBox="0 0 128 128" fill="none"
    xmlns="http://www.w3.org/2000/svg">
    <!-- Launcher / store icon. Unlike the panel icons this one is NOT recolored by
         libcosmic, so it carries its own palette and must stay legible on both light
         and dark backgrounds. Full-bleed tile, no transparent padding, per Flathub
         icon guidance. -->
    <defs>
        <linearGradient id="tile" x1="0" y1="0" x2="0" y2="128"
            gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#6F4B33" />
            <stop offset="1" stop-color="#4A2F1F" />
        </linearGradient>
    </defs>

    <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#tile)" />

    <!-- The cup mark is the 16x16 panel drawing scaled 6x and centred, so the
         launcher entry and the panel icon are recognisably the same object. -->
    <g transform="translate(16 16) scale(6)" fill="none">
        <g stroke="#F4E4D4" stroke-width="1.5" stroke-linecap="round">
            <path d="M 4.35 4.5 L 5.15 2.1" />
            <path d="M 7.85 4.5 L 8.65 2.1" />
        </g>

        <path d="M 2 6 L 11 6 L 11 12
                 A 2 2 0 0 1 9 14
                 L 4 14
                 A 2 2 0 0 1 2 12 Z"
            fill="#F4E4D4" />

        <path d="M 10.25 8 A 2 2 0 1 1 10.25 11.5"
            stroke="#F4E4D4" stroke-width="1.5" />
    </g>
</svg>
